name: Build Android TV APK
on:
  push:
    branches: [android-tv]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle -p android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pc5-tv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pc5-tv-launcher.apk
          gh release delete tv-latest -y --cleanup-tag || true
          gh release create tv-latest pc5-tv-launcher.apk --target "$GITHUB_SHA" --prerelease \
            --title "PC5 Android TV (latest build)" --notes "Debug build of the Android TV port from branch android-tv."
